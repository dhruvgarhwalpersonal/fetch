name: Weekly yt-dlp update

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3am UTC
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get latest yt-dlp version
        id: latest
        run: |
          pip install --quiet yt-dlp
          VERSION=$(python -c "import yt_dlp; print(yt_dlp.version.__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update requirements.txt
        run: |
          sed -i "s/^yt-dlp.*/yt-dlp==${{ steps.latest.outputs.version }}/" requirements.txt
          echo "Updated yt-dlp to ${{ steps.latest.outputs.version }}"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Already up to date, no commit needed" && exit 0
          git add requirements.txt
          git commit -m "chore: bump yt-dlp to ${{ steps.latest.outputs.version }}"
          git push
