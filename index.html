<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotidrop — Download any Spotify track</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Full-viewport background — color driven by album art -->
<div id="bg-aurora"></div>
<div id="bg-aurora-2"></div>

<!-- Glass atmosphere panel -->
<div class="glass-shell">
<div class="page">

  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    </div>
    <span class="logo-text">Spoti<span>drop</span></span>
    <span class="badge"><span class="server-dot" id="sdot"></span><span id="sstatus">checking…</span></span>
  </header>

  <div class="hero">
    <h1>Download any<br>song from <em>Spotify</em></h1>
    <p>Drop any Spotify link and get the song as a high-quality MP3 — straight to your device.<br>
       No sign-up. No limits. Just paste, click, done.</p>
  </div>

  <div class="input-wrap">
    <div class="input-row" id="input-row">
      <input type="text" id="spotify-input" placeholder="https://open.spotify.com/track/…" autocomplete="off" spellcheck="false"/>
      <button class="btn-go" id="go-btn" onclick="startDownload()">Download</button>
    </div>
    <div class="steps" id="steps-row">
      <div class="step" id="s1"><span class="step-num">1</span> Metadata</div>
      <span class="step-arrow">→</span>
      <div class="step" id="s2"><span class="step-num">2</span> Cover</div>
      <span class="step-arrow">→</span>
      <div class="step" id="s3"><span class="step-num">3</span> Match</div>
      <span class="step-arrow">→</span>
      <div class="step" id="s4"><span class="step-num">4</span> Save MP3</div>
    </div>
  </div>

  <div id="progress-area">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="prog-bar"></div></div>
    <div class="progress-log"><div class="pulse-dot"></div><span id="prog-text">Starting…</span></div>
  </div>

  <div id="error-area"></div>

  <div id="result-card">
    <div class="card-glow" id="card-glow"></div>
    <div class="card-inner">
      <div class="cover-wrap">
        <img id="cover-img" src="" alt="cover" crossorigin="anonymous"/>
        <div class="cover-overlay"></div>
      </div>
      <div class="track-info">
        <div class="track-label">downloaded</div>
        <div class="track-name" id="track-name">—</div>
        <div class="track-artist" id="track-artist">—</div>
        <a class="btn-download" id="dl-link" href="#">
          <svg viewBox="0 0 24 24">
            <path d="M12 4v12"/>
            <path d="M8 13l4 4 4-4"/>
            <path d="M5 19h14"/>
          </svg>
          Save MP3
        </a>
      </div>
    </div>
  </div>

  <div id="history-section">
    <div class="history-title">recent downloads</div>
    <div id="history-list"></div>
  </div>

</div><!-- .page -->
</div><!-- .glass-shell -->

<script>
const SERVER = 'http://localhost:8000';
const $      = id => document.getElementById(id);
const wait   = ms => new Promise(r => setTimeout(r, ms));

let dlHistory = [];
try { dlHistory = JSON.parse(localStorage.getItem('spotidrop_h') || '[]'); } catch(e) {}

// ── Dynamic accent color from album art ──────────────────────────────────────
function extractColor(imgEl, callback) {
  try {
    const canvas = document.createElement('canvas');
    // Use larger sample for better color accuracy
    const SIZE = 50;
    canvas.width = canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, SIZE, SIZE);
    const d = ctx.getImageData(0, 0, SIZE, SIZE).data;

    // Build color buckets — quantize into 8x8x8 = 512 buckets
    const buckets = {};
    for (let i = 0; i < d.length; i += 4) {
      const alpha = d[i+3];
      if (alpha < 128) continue; // skip transparent

      const r = d[i], g = d[i+1], b = d[i+2];
      const lum = r * 0.299 + g * 0.587 + b * 0.114;

      // Skip near-black and near-white
      if (lum < 18 || lum > 238) continue;

      // Compute saturation
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      const sat = max === 0 ? 0 : (max - min) / max;
      // Require some saturation — skip grays
      if (sat < 0.12) continue;

      // Quantize to reduce noise — bin into 32-step buckets
      const br = Math.round(r / 32) * 32;
      const bg = Math.round(g / 32) * 32;
      const bb = Math.round(b / 32) * 32;
      const key = `${br},${bg},${bb}`;

      if (!buckets[key]) buckets[key] = { r: 0, g: 0, b: 0, count: 0, sat: 0 };
      buckets[key].r += r;
      buckets[key].g += g;
      buckets[key].b += b;
      buckets[key].count++;
      buckets[key].sat += sat;
    }

    const entries = Object.values(buckets);
    if (entries.length === 0) return callback(29, 185, 84); // default green

    // Score each bucket: frequency × saturation (prefer vivid colors)
    let best = null, bestScore = -1;
    for (const e of entries) {
      const avgSat = e.sat / e.count;
      const score = e.count * (0.4 + avgSat * 2.0); // weight saturation heavily
      if (score > bestScore) {
        bestScore = score;
        best = e;
      }
    }

    let r = Math.round(best.r / best.count);
    let g = Math.round(best.g / best.count);
    let b = Math.round(best.b / best.count);

    // Boost vibrancy: push toward the dominant channel
    const max = Math.max(r, g, b);
    if (max < 100) {
      // Dark color — brighten it
      const factor = 160 / max;
      r = Math.min(255, Math.round(r * factor));
      g = Math.min(255, Math.round(g * factor));
      b = Math.min(255, Math.round(b * factor));
    }

    callback(r, g, b);
  } catch(e) {
    callback(29, 185, 84); // fallback
  }
}

function applyAccentColor(r, g, b) {
  const hex = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  // Lighter variant for hi
  const rh = Math.min(255, Math.round(r + (255-r)*0.22));
  const gh = Math.min(255, Math.round(g + (255-g)*0.22));
  const bh = Math.min(255, Math.round(b + (255-b)*0.22));
  const hexHi = '#' + [rh,gh,bh].map(v => v.toString(16).padStart(2,'0')).join('');

  // Batch all CSS variable updates at once — no lag
  const root = document.documentElement;
  root.style.setProperty('--accent',      hex);
  root.style.setProperty('--accent-hi',   hexHi);
  root.style.setProperty('--accent-rgb',  `${r},${g},${b}`);
  root.style.setProperty('--accent-dim',  `rgba(${r},${g},${b},0.10)`);
  root.style.setProperty('--accent-glow', `rgba(${r},${g},${b},0.20)`);
  root.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.06)`);

  // ── Full-page background: blurred solid fill (not aurora glows) ───────────
  const aurora = $('bg-aurora');
  if (aurora) {
    // Use a single blurred solid color covering the entire viewport
    aurora.style.background = `rgba(${r},${g},${b},1)`;
    aurora.style.opacity = '1';
  }
  // aurora-2 unused now, keep hidden
  const aurora2 = $('bg-aurora-2');
  if (aurora2) aurora2.style.opacity = '0';

  // ── Card glow — subtle, just below the card ────────────────────────────────
  const glow = $('card-glow');
  if (glow) {
    glow.style.background = `radial-gradient(ellipse 80% 60% at 50% 110%, rgba(${r},${g},${b},0.50) 0%, transparent 70%)`;
    glow.style.opacity = '1';
  }

  // ── Result card border glow — light, not heavy ─────────────────────────────
  const card = $('result-card');
  if (card) {
    card.style.boxShadow = `0 32px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(${r},${g},${b},0.18), 0 0 48px rgba(${r},${g},${b},0.14)`;
  }
}

// ── Server health check ───────────────────────────────────────────────────────
async function checkServer() {
  try {
    const r = await fetch(SERVER + '/api/ping', { signal: AbortSignal.timeout(2500) });
    if (r.ok) {
      $('sdot').className = 'server-dot online';
      $('sstatus').textContent = 'server online';
      return true;
    }
  } catch(e) {}
  $('sdot').className = 'server-dot';
  $('sstatus').textContent = 'server offline';
  return false;
}

// ── UI helpers ────────────────────────────────────────────────────────────────
const setProgress = (pct, txt) => {
  $('prog-bar').style.width  = pct + '%';
  $('prog-text').textContent = txt;
};

function showProgress(on) {
  $('progress-area').style.display = on ? 'block' : 'none';
}
function showError(msg) {
  const el = $('error-area');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() {
  $('error-area').style.display = 'none';
}

function setStep(n) {
  ['s1','s2','s3','s4'].forEach((id, i) => {
    const el = $(id);
    el.className = 'step' + (i+1 < n ? ' done' : i+1 === n ? ' active' : '');
  });
}

function lockInput(locked) {
  const inp = $('spotify-input');
  const btn = $('go-btn');
  inp.disabled = locked;
  btn.disabled = locked;
  const row = $('input-row');
  if (locked) {
    inp.style.opacity = '0.65';
    inp.style.cursor  = 'not-allowed';
    row && row.classList.add('downloading');
  } else {
    inp.style.opacity = '1';
    inp.style.cursor  = 'text';
    row && row.classList.remove('downloading');
  }
}

function extractTrackId(url) {
  const m = url.match(/spotify\.com\/(?:intl-[a-z]+\/)?track\/([a-zA-Z0-9]+)/);
  return m ? m[1] : null;
}

// ── Metadata ─────────────────────────────────────────────────────────────────
async function fetchMeta(trackId) {
  const r = await fetch(
    SERVER + '/api/spotify-meta?' + new URLSearchParams({ id: trackId }),
    { signal: AbortSignal.timeout(30000) }
  );
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.error || `Metadata fetch failed (${r.status})`);
  }
  const d = await r.json();
  if (!d.title || !d.artist) throw new Error('Could not extract track metadata from Spotify.');
  return { track: d.title, artist: d.artist, album: d.album || d.title, cover: d.cover || '' };
}

// ── YouTube search ────────────────────────────────────────────────────────────
async function findYouTube(track, artist) {
  const r = await fetch(
    SERVER + '/api/youtube-search?' + new URLSearchParams({ title: track, artist }),
    { signal: AbortSignal.timeout(30000) }
  );
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.error || `YouTube search failed (${r.status})`);
  }
  const d = await r.json();
  if (!d.youtube_url) throw new Error('No YouTube match found.');
  return d.youtube_url;
}

// ── Download + poll ───────────────────────────────────────────────────────────
async function downloadViaServer(ytUrl, meta) {
  const startR = await fetch(SERVER + '/api/download', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      youtube_url: ytUrl,
      title:  meta.track,
      artist: meta.artist,
      album:  meta.album,
      cover:  meta.cover,
    }),
    signal: AbortSignal.timeout(10000),
  });
  if (!startR.ok) throw new Error('Server error starting download: ' + startR.status);
  const { job_id } = await startR.json();

  for (let i = 0; i < 120; i++) {
    await wait(1000);
    const pollR = await fetch(SERVER + '/api/progress/' + job_id, { signal: AbortSignal.timeout(5000) });
    const job   = await pollR.json();
    if (job.error) throw new Error(job.error);
    const pct = job.progress || 0;
    setProgress(60 + Math.round(pct * 0.38), `Almost there… ${pct}%`);
    if (job.status === 'done') return SERVER + '/api/file/' + job_id;
  }
  throw new Error('Download timed out — try again.');
}

// ── Main ──────────────────────────────────────────────────────────────────────
async function startDownload() {
  const input = $('spotify-input').value.trim();

  hideError();
  $('result-card').style.display = 'none';
  if (!input) { showError('Paste a Spotify track link first.'); return; }

  const trackId = extractTrackId(input);
  if (!trackId) {
    showError('Invalid Spotify link. Example: https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT');
    return;
  }

  lockInput(true);
  showProgress(true);
  setStep(0);

  try {
    setStep(1);
    setProgress(5, 'Looking up your track…');
    const meta = await fetchMeta(trackId);
    setStep(2);
    setProgress(22, `Got it — ${meta.track}`);

    $('spotify-input').value = `${meta.track} — ${meta.artist}`;

    $('cover-img').src            = meta.cover || '';
    $('track-name').textContent   = meta.track;
    $('track-artist').textContent = meta.artist;
    $('dl-link').href             = '#';
    $('dl-link').removeAttribute('download');
    $('dl-link').style.opacity       = '0.4';
    $('dl-link').style.pointerEvents = 'none';
    $('dl-link').innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 4v12"/><path d="M8 13l4 4 4-4"/><path d="M5 19h14"/></svg> Preparing…`;

    if (meta.cover) {
      $('result-card').style.setProperty('--cover-bg', `url(${meta.cover})`);
    }
    $('result-card').style.display = 'block';

    // Load cover image and extract color — works for all covers via proxy
    const coverImg = $('cover-img');
    const doExtract = () => {
      // Try direct extraction first
      try {
        extractColor(coverImg, applyAccentColor);
      } catch(e) {
        // If CORS fails, load via canvas proxy
        loadViaProxy(meta.cover);
      }
    };

    const loadViaProxy = (url) => {
      const proxyImg = new Image();
      proxyImg.crossOrigin = 'anonymous';
      proxyImg.onload = () => extractColor(proxyImg, applyAccentColor);
      proxyImg.onerror = () => {}; // silently fail, keep default color
      proxyImg.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    };

    if (coverImg.complete && coverImg.naturalWidth > 0) {
      doExtract();
    } else {
      coverImg.onload = doExtract;
      coverImg.onerror = () => {};
    }

    await wait(200);

    setStep(3);
    setProgress(30, 'Finding the best version…');
    const ytUrl = await findYouTube(meta.track, meta.artist);
    setProgress(50, 'Perfect match found — hang tight…');
    await wait(150);

    setStep(4);
    setProgress(55, 'Preparing your file…');
    await wait(150);
    const fileUrl = await downloadViaServer(ytUrl, meta);

    setProgress(100, '✓ Done!');
    await wait(300);
    showProgress(false);
    setStep(5);

    $('cover-img').src            = meta.cover;
    $('track-name').textContent   = meta.track;
    $('track-artist').textContent = meta.artist;
    $('dl-link').href             = fileUrl;
    $('dl-link').download         = `${meta.track} - ${meta.artist}.mp3`;
    $('dl-link').style.opacity       = '1';
    $('dl-link').style.pointerEvents = 'auto';
    $('dl-link').innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 4v12"/><path d="M8 13l4 4 4-4"/><path d="M5 19h14"/></svg> Save MP3`;
    $('result-card').style.display = 'block';

    const a = document.createElement('a');
    a.href = fileUrl;
    a.download = `${meta.track} - ${meta.artist}.mp3`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => document.body.removeChild(a), 500);

    const item = { track: meta.track, artist: meta.artist, cover: meta.cover, url: fileUrl };
    dlHistory = [item, ...dlHistory.filter(h => h.track !== item.track)].slice(0, 8);
    try { localStorage.setItem('spotidrop_h', JSON.stringify(dlHistory)); } catch(e) {}
    renderHistory();

  } catch(err) {
    showProgress(false);
    showError(err.message || 'Something went wrong.');
    setStep(0);
    $('spotify-input').value = input;
  } finally {
    lockInput(false);
  }
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const sec = $('history-section'), list = $('history-list');
  if (!dlHistory.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = dlHistory.map(h => `
    <div class="history-item">
      <img class="history-cover" src="${h.cover}" alt="" onerror="this.style.opacity=0"/>
      <div class="history-info">
        <div class="history-name">${h.track}</div>
        <div class="history-artist">${h.artist}</div>
      </div>
      <a class="history-dl-btn" href="${h.url}" download="${h.track} - ${h.artist}.mp3" title="Download ${h.track}">
        <svg viewBox="0 0 24 24">
          <path d="M12 4v12"/>
          <path d="M8 13l4 4 4-4"/>
          <path d="M5 19h14"/>
        </svg>
      </a>
    </div>`).join('');
}

$('spotify-input').addEventListener('keydown', e => { if (e.key === 'Enter') startDownload(); });
checkServer();
setInterval(checkServer, 12000);
renderHistory();
</script>
</body>
</html>
